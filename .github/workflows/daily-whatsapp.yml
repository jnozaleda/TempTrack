name: Daily WhatsApp summary

on:
  # The daily send is started at 08:00 Madrid time by the Cloudflare Worker (push-worker/),
  # as mode "scheduled". GitHub's own schedule below is only a backup: it runs late or not at
  # all when busy. The script sends once a day, between 08:00 and 12:00; other runs no-op.
  schedule:
    - cron: "7,22,37,52 5-7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run = print only · push_only = Web Push only · wa_only = WhatsApp only · hello_world = Meta's sample · text_preview = today's WhatsApp as text (only if you wrote to the test number in the last 24 h) · template = the real message (WhatsApp + push) · scheduled = the daily send, once a day (used by the Cloudflare clock)"
        type: choice
        options: [dry_run, push_only, wa_only, hello_world, text_preview, template, scheduled]
        default: dry_run

# Never two runs at once, so a slow run and the next one can't both send.
concurrency:
  group: daily-summary
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm ci --omit=dev
      - name: Send
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_RECIPIENTS: ${{ secrets.WHATSAPP_RECIPIENTS }}
          WHATSAPP_PHONE_NUMBER_ID: "1327808770424150"
          WEBPUSH_API: ${{ vars.WEBPUSH_API }}
          WEBPUSH_ADMIN_TOKEN: ${{ secrets.WEBPUSH_ADMIN_TOKEN }}
          WEBPUSH_SUBSCRIPTIONS: ${{ secrets.WEBPUSH_SUBSCRIPTIONS }}
          WEBPUSH_VAPID_PUBLIC: "BHiR-87Dl6hNut9NoRG3kGIMYag3bgfg3fr3GyTShZEVTigWuCoTGbCtWc3veeUj3ETap09yhJTCuOWP5hqKN-Q"
          WEBPUSH_VAPID_PRIVATE: ${{ secrets.WEBPUSH_VAPID_PRIVATE }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'template' }}
        run: node whatsapp/send-daily.mjs
