name: Daily WhatsApp summary

on:
  schedule:
    # 08:00 in Madrid: 06:00 UTC in summer, 07:00 UTC in winter. Both fire; the script keeps
    # only the right one. GitHub may start scheduled runs a few minutes late.
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run = print only · hello_world = Meta's sample · text_preview = today's message as text (only if you wrote to the test number in the last 24 h) · template = the real message"
        type: choice
        options: [dry_run, hello_world, text_preview, template]
        default: dry_run

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Send
        working-directory: web
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_RECIPIENTS: ${{ secrets.WHATSAPP_RECIPIENTS }}
          WHATSAPP_PHONE_NUMBER_ID: "1327808770424150"
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'template' }}
        run: node whatsapp/send-daily.mjs
